<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>{{ data.message }}</mat-dialog-content>
<mat-dialog-actions align="end">
  <button matButton (click)="cancel()">{{ data.cancelLabel || 'Annuler' }}</button>
  <button matButton="tonal" color="warn" (click)="confirm()">{{ data.confirmLabel || 'Confirmer' }}</button>
</mat-dialog-actions>

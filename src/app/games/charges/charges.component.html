<div class="container">

  @if (showIntroduction) {
    <app-introduction [@slideInFromLeft]></app-introduction>
  }

  @if (showGame) {
    <div class="game" [@slideInFromRight]>
      <mat-grid-list cols="6" rowHeight="fit" gutterSize="0.2rem">
        <mat-grid-tile colspan="4" rowspan="1">
          <app-score-stars [score]="score" [maxScore]="maxScore"></app-score-stars>
        </mat-grid-tile>
        <mat-grid-tile colspan="2" rowspan="1">
          <app-stopwatch></app-stopwatch>
        </mat-grid-tile>
        <mat-grid-tile colspan="6" rowspan="6">
          <div class="stage" [class.full]="score === maxScore">
            <!-- batterie : le fond se remplit et passe du rouge au vert -->
            <div class="battery" [style.height.%]="batteryLevel" [style.background-color]="batteryColor"></div>
            <svg class="bubbles" viewBox="0 0 360 400" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
              @for (b of bubbles; track $index) {
                <circle [attr.cx]="b.cx" [attr.cy]="b.cy" [attr.r]="b.r"
                  [style.animation-duration.s]="b.duration" [style.animation-delay.s]="b.delay"></circle>
              }
            </svg>
            <svg class="board" viewBox="0 0 360 400">
              @for (it of draw; track it; let i = $index) {
                @if (i === current) {
                  <g [@fadeIn]>
                    @for (prop of it.propositions; track prop; let p = $index) {
                      <g [attr.transform]="'translate(' + arch[p].x + ',' + arch[p].y + ')'">
                        <g class="prop {{prop.css}}" (click)="selectCharge(it, p)">
                          <circle r="40"></circle>
                          <text y="14" text-anchor="middle">{{prop.charge}}</text>
                        </g>
                      </g>
                    }
                    <foreignObject x="0" y="230" width="360" height="160">
                      <div xmlns="http://www.w3.org/1999/xhtml" class="formula {{formulaSize(it)}}" [class.correct]="correct">
                        <span class="ion">
                          <span [innerHTML]="it.symbol"></span>
                          <!-- hors flux : la formule ne bouge pas quand la charge apparaît -->
                          @if (correct) {
                            <sup class="charge">{{it.charge}}</sup>
                          }
                        </span>
                      </div>
                    </foreignObject>
                  </g>
                }
              }
              @for (pen of penalties; track pen.id) {
                <text class="penalty" [attr.x]="pen.x" [attr.y]="pen.y - 50" text-anchor="middle">+{{penaltySeconds}} s</text>
              }
            </svg>
          </div>
        </mat-grid-tile>
        <mat-grid-tile colspan="6" rowspan="2">
          <button mat-mini-fab color="primary" (click)="intro()">
            <mat-icon>arrow_back</mat-icon>
          </button>
        </mat-grid-tile>
      </mat-grid-list>
    </div>
  }

  @if (showResults) {
    <app-show-results [@slideInFromRight]></app-show-results>
  }

</div>

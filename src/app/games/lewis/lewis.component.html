<div class="container">

  @if (showIntroduction) {
    <app-introduction [@slideInFromLeft]></app-introduction>
  }

  @if (showGame) {
    <div class="game" [@slideInFromRight]>
      <mat-grid-list cols="6" rowHeight="fit" gutterSize="0.2rem">
        <mat-grid-tile colspan="4" rowspan="1">
          <app-score-stars [score]="score" [maxScore]="maxScore"></app-score-stars>
        </mat-grid-tile>
        <mat-grid-tile colspan="2" rowspan="1">
          <app-stopwatch></app-stopwatch>
        </mat-grid-tile>
        <mat-grid-tile colspan="6" rowspan="6">
          <svg class="board" viewBox="-22 -22 354 354">
            <defs>
              <radialGradient id="lewis-gradient">
                <stop offset="33%" stop-color="#E8EAF6" />
                <stop offset="95%" stop-color="#D0D9FF" />
              </radialGradient>
              <filter id="lewis-shadow" x="-30%" y="-30%" width="160%" height="160%">
                <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1A237E" flood-opacity="0.18" />
              </filter>
            </defs>
            @for (it of draw; track it; let i = $index) {
              @if (i === current) {
                <g [@fadeIn]>
                  <g class="reference" [class.won]="correct">
                    <circle cx="155" cy="155" r="72" fill="url(#lewis-gradient)"></circle>
                    <text class="roman" x="155" y="113" text-anchor="middle">{{getRoman(it)}}</text>
                    <text class="symbol" x="155" y="177" text-anchor="middle">{{it.symbol}}</text>
                    <text class="name" x="155" y="203" text-anchor="middle">{{it.name}}</text>
                  </g>
                  <!-- bulles par-dessus l'élément central ; la bulle survolée passe au premier plan -->
                  @for (prop of layered(it); track prop) {
                    <g [attr.transform]="'translate(' + prop.x + ',' + prop.y + ')'">
                      <g class="prop {{prop.css}}" [class.lift]="prop === hovered && prop.css === ''">
                        <circle class="halo" cx="155" cy="155" r="44"></circle>
                        <circle class="disc" cx="155" cy="155" r="44"></circle>
                        <text class="symbol" x="155" y="164" text-anchor="middle">{{it.symbol}}</text>
                        <g lewis-structure [n]="prop.n" [css]="prop.css"></g>
                      </g>
                    </g>
                  }
                  <!-- zones de clic : couche fixe au-dessus de tout, jamais réordonnée -->
                  @for (prop of it.propositions; track prop) {
                    <circle class="hit {{prop.css}}" [attr.cx]="155 + prop.x" [attr.cy]="155 + prop.y" r="46"
                      (pointerenter)="hover(prop, $event)" (pointerleave)="hovered = null"
                      (click)="selectStructure(it, prop)"></circle>
                  }
                </g>
              }
            }
            @for (pen of penalties; track pen.id) {
              <text class="penalty" [attr.x]="155 + pen.x" [attr.y]="155 + pen.y - 30" text-anchor="middle">+{{penaltySeconds}} s</text>
            }
          </svg>
        </mat-grid-tile>
        <mat-grid-tile colspan="6" rowspan="2">
          <button mat-mini-fab color="primary" (click)="intro()">
            <mat-icon>arrow_back</mat-icon>
          </button>
        </mat-grid-tile>
      </mat-grid-list>
    </div>
  }

  @if (showResults) {
    <app-show-results [@slideInFromRight]></app-show-results>
  }

</div>

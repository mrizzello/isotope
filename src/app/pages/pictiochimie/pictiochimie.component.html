@if (!play) {
  <div class="selection" [@fadeIn]>
    <p>
      <img class="logo" src="./assets/pictiochimie.png" alt="pictiochimie" />
    </p>
    <h4>
      Choisir les chapitres :
    </h4>
    <mat-divider></mat-divider>
    <mat-selection-list #chapters>
      @for (item of data; track item) {
        <mat-list-option (click)="toggleSelect(item)" [selected]="item.selected">
          {{ item.n }}. {{ item.chapter }}
        </mat-list-option>
      }
    </mat-selection-list>
    <mat-divider></mat-divider>
    <div class="button-row">
      <button mat-raised-button color="primary" (click)="start()" [disabled]="!hasSelection">Commencer</button>
    </div>
  </div>
}
@if (play) {
  <div class="game" [@fadeIn]>
    <div class="game-bar">
      <button mat-icon-button (click)="home()" aria-label="Retour aux chapitres">
        <mat-icon>home</mat-icon>
      </button>
      <div class="progress">
        <div class="counter">{{ cursor + 1 }} / {{ words.length }}</div>
        <div class="track">
          <div class="fill" [style.width.%]="((cursor + 1) / words.length) * 100"
               [style.background-size]="(words.length / (cursor + 1)) * 100 + '% 100%'"></div>
        </div>
      </div>
      <button mat-icon-button (click)="openScoreWindow()" aria-label="Ouvrir le tableau de score">
        <mat-icon>scoreboard</mat-icon>
      </button>
    </div>

    <div class="warning-row">
      <div class="warning">
        <mat-icon>block</mat-icon>
        Pas de chiffres, ni de lettres
      </div>
    </div>

    <div class="word-stage">
      @if (!finished) {
        <div class="word" [@wordSwap]="cursor">{{ words[cursor] }}</div>
      } @else {
        <div class="end" [@fadeIn]>
          <div class="end-title">Tous les mots ont été joués</div>
          <div class="end-actions">
            <button mat-raised-button class="violet" (click)="start()">
              <mat-icon>shuffle</mat-icon> Remélanger
            </button>
            <button mat-stroked-button class="outline" (click)="play = false">
              <mat-icon>list</mat-icon> Chapitres
            </button>
          </div>
        </div>
      }
    </div>

    <div class="game-nav">
      <button mat-fab class="violet" (click)="prev()" [disabled]="cursor === 0 && !finished" aria-label="Mot précédent">
        <mat-icon>chevron_left</mat-icon>
      </button>
      <button mat-fab class="violet" (click)="next()" [disabled]="finished" aria-label="Mot suivant">
        <mat-icon>chevron_right</mat-icon>
      </button>
    </div>
  </div>
}
